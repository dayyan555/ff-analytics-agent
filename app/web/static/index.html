<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing analytics agent</title>
<style>
  :root{--bg:#f4f5f7;--panel:#fff;--ink:#1c1e21;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-ink:#fff;
        --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;--purple:#7c3aed;--neutral:#6b7280;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .status{font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neutral);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  main{flex:1;overflow-y:auto;padding:20px 16px 8px}
  .thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:100%}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:88%;padding:12px 14px;border-radius:14px;word-wrap:break-word}
  .user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
  .agent .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;width:100%}
  .avatar{width:28px;height:28px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:4px}
  .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;margin-bottom:8px}
  .badge.answer{background:var(--ok)} .badge.clarify{background:var(--warn)} .badge.unsupported{background:var(--purple)}
  .badge.no_data{background:var(--info)} .badge.error{background:var(--bad)} .badge.busy{background:var(--neutral)}
  .body{font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap}
  .footer{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);white-space:normal}
  .meta{margin-top:6px;font-size:12px;color:var(--muted)}
  details{margin-top:8px;font-size:13px}
  summary{cursor:pointer;color:var(--accent);user-select:none}
  .tabs{display:flex;gap:4px;margin:8px 0}
  .tabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .tabs button.active{border-color:var(--accent);color:var(--accent)}
  .tab{display:none;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;max-height:340px;overflow-y:auto}
  .tab.active{display:block}
  pre{margin:0;font-family:var(--mono);font-size:12px;white-space:pre}
  table{border-collapse:collapse;font-family:var(--mono);font-size:12px;white-space:nowrap}
  th,td{border-bottom:1px solid var(--line);padding:4px 10px;text-align:right} th:first-child,td:first-child{text-align:left}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .typing{display:inline-flex;gap:4px;padding:4px 0}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .composer{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px}
  .composer .row{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;line-height:1.4;max-height:160px;outline:none}
  textarea:focus{border-color:var(--accent)}
  .send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;height:42px;font:inherit;font-weight:600;cursor:pointer}
  .send:disabled{opacity:.5;cursor:default}
  .hint{max-width:820px;margin:6px auto 0;font-size:11px;color:var(--muted)}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Marketing analytics agent</h1>
  <div class="status" id="status"><span class="dot"></span>connecting…</div>
</header>

<main id="main"><div class="thread" id="thread"></div></main>

<div class="composer">
  <div class="row">
    <textarea id="question" rows="1" placeholder="Ask about spend, purchases, ROAS… by channel or campaign"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line · one question at a time (free-model quota)</div>
</div>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread'), main = $('main'), input = $('question'), sendBtn = $('send');
let busy = false, health = null, pendingClarification = null;  // {question} when the last reply asked for details
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty = o => o == null ? '—' : JSON.stringify(o, null, 2);
const scrollDown = () => { main.scrollTop = main.scrollHeight; };

function bubble(kind, html) {
  const wrap = document.createElement('div'); wrap.className = 'msg ' + kind;
  wrap.innerHTML = (kind === 'agent' ? '<div class="avatar">FF</div>' : '') + '<div class="bubble">' + html + '</div>';
  thread.appendChild(wrap); scrollDown(); return wrap;
}

// ---- header status -------------------------------------------------------
async function loadHealth() {
  try {
    health = await (await fetch('/health')).json();
    const cube = health.cube === 'ok';
    const cat = health.catalog && health.catalog.loaded
      ? `catalog: ${health.catalog.measures.length} metrics / ${health.catalog.dimensions.length} dimensions · data ${health.catalog.coverage.first} → ${health.catalog.coverage.last}`
      : 'catalog: not loaded';
    $('status').innerHTML = `<span class="dot ${cube ? 'ok' : 'bad'}"></span>Cube ${cube ? 'ok' : 'down'} (${esc(health.cube_url_kind)}) · ${esc(cat)} · tracing ${health.langfuse === 'enabled' ? 'on' : 'off'} · ${esc(health.model)}`;
    if (!cube || !(health.catalog && health.catalog.loaded)) {
      const note = $('degraded') || Object.assign(document.createElement('div'), {id: 'degraded'});
      note.className = 'msg agent'; note.innerHTML = `<div class="avatar">FF</div><div class="bubble"><span class="badge error">semantic layer</span><div>${esc(health.catalog_error || 'Cube is not reachable right now.')}</div></div>`;
      if (!$('degraded')) thread.appendChild(note);
    } else if ($('degraded')) $('degraded').remove();
  } catch (e) { $('status').innerHTML = '<span class="dot bad"></span>server unreachable'; }
  setTimeout(loadHealth, 10000);
}

// ---- empty state -----------------------------------------------------------
async function greet() {
  let examples = [], h = null;
  try { examples = (await (await fetch('/examples')).json()).examples; } catch (e) {}
  try { h = await (await fetch('/health')).json(); } catch (e) {}
  const cat = h && h.catalog && h.catalog.loaded ? h.catalog : null;
  const dims = cat ? cat.dimensions.map(d => d.replace('_', ' ')).join(', ') : 'channel, campaign, country, device or objective';
  const span = cat ? ` The data covers ${esc(cat.coverage.first)} to ${esc(cat.coverage.last)}.` : '';
  const chips = examples.map(e => `<button class="chip" data-q="${esc(e.question)}" title="${esc(e.kind)}">${esc(e.question)}</button>`).join('');
  bubble('agent', `<div>Hi. I answer questions about marketing performance — spend, purchases, revenue, ROAS, cost per purchase and more — by ${esc(dims)}.${span} Every number comes from the semantic layer; if I can't answer, I'll say why.</div><div class="chips">${chips}</div>`);
  thread.addEventListener('click', ev => { const c = ev.target.closest('.chip'); if (c) { input.value = c.dataset.q; autosize(); input.focus(); } });
}

// ---- asking ----------------------------------------------------------------
async function ask() {
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true; input.value = ''; autosize();
  bubble('user', esc(q));
  // The agent is single-turn. If it just asked for details, send the original question
  // together with this reply so the follow-up carries its context.
  const question = pendingClarification ? `${pendingClarification.question}\n(Additional details from the user: ${q})` : q;
  const typing = bubble('agent', '<div class="typing"><i></i><i></i><i></i></div>');
  const t0 = performance.now();
  let resp, status = 0;
  try {
    const r = await fetch('/ask', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question})});
    status = r.status; resp = await r.json();
  } catch (e) { resp = {outcome: 'error', error_kind: 'network', error: String(e), answer_body: 'The server did not respond: ' + String(e), llm_calls: 0, cube_calls: 0, timing_ms: Math.round(performance.now() - t0)}; }
  typing.querySelector('.bubble').innerHTML = renderAgent(resp, status);
  pendingClarification = resp.outcome === 'clarify' ? {question} : null;
  busy = false; sendBtn.disabled = false; input.focus(); scrollDown(); loadHealth();
}

function renderAgent(resp, status) {
  const outcome = resp.outcome || 'error';
  const badge = outcome === 'error' ? `error · ${esc(resp.error_kind || 'unknown')}` : outcome.replace('_', ' ');
  const body = resp.answer_body || resp.answer || resp.error || '';
  const stage = resp.error_stage === 'catalog' ? '<div class="meta">graph not invoked — no model call was made</div>' : '';
  const meta = `${(resp.timing_ms / 1000).toFixed(1)} s · model calls ${resp.llm_calls ?? 0} · cube calls ${resp.cube_calls ?? 0}` + (resp.llm_model ? ` · ${esc(resp.llm_model)}` : '') + (status ? ` · HTTP ${status}` : '');
  const id = 'd' + Math.random().toString(36).slice(2);
  const hood = resp.plan || resp.cube_query || resp.trace_id ? `
    <details>
      <summary>Under the hood</summary>
      <div class="tabs" data-for="${id}">
        <button class="active" data-tab="plan">Plan</button><button data-tab="query">Cube query</button>
        <button data-tab="rows">Rows</button><button data-tab="result">Result</button><button data-tab="trace">Trace</button>
      </div>
      <div class="tab active" id="${id}-plan"><pre>${esc(pretty(resp.plan))}</pre></div>
      <div class="tab" id="${id}-query"><pre>${esc(pretty(resp.cube_query))}</pre></div>
      <div class="tab" id="${id}-rows">${renderRows(resp.rows || [], resp.annotation)}</div>
      <div class="tab" id="${id}-result"><pre>${esc(pretty(resp.result))}</pre></div>
      <div class="tab" id="${id}-trace">${traceHtml(resp)}</div>
    </details>` : '';
  return `<span class="badge ${esc(outcome)}">${badge}</span><div class="body">${esc(body)}</div>${stage}` +
         (resp.footer ? `<div class="footer">${esc(resp.footer)}</div>` : '') + `<div class="meta">${meta}</div>${hood}`;
}

function renderRows(rowSets, annotation) {
  if (!rowSets.length || rowSets.every(r => !r.length)) return '<div class="meta">no rows</div>';
  const ann = Object.assign({}, (annotation || {}).dimensions || {}, (annotation || {}).measures || {});
  const title = k => (ann[k] && ann[k].shortTitle) || k.replace('marketing_performance.', '');
  return rowSets.map((rows, i) => {
    if (!rows.length) return `<div class="meta">result set ${i + 1}: no rows</div>`;
    const keys = Object.keys(rows[0]).filter(k => k !== 'compareDateRange');
    const head = keys.map(k => `<th>${esc(title(k))}</th>`).join('');
    const body = rows.map(r => '<tr>' + keys.map(k => `<td>${r[k] == null ? '—' : esc(r[k])}</td>`).join('') + '</tr>').join('');
    return (rowSets.length > 1 ? `<div class="meta">result set ${i + 1} (${esc(rows[0].compareDateRange || '')})</div>` : '') + `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  }).join('');
}

function traceHtml(resp) {
  if (resp.trace_url) return `<a href="${esc(resp.trace_url)}" target="_blank" rel="noopener">Open trace in Langfuse</a><div class="meta">${esc(resp.trace_id)} · traces appear ~15–30 s after the answer</div>`;
  if (resp.trace_id) return `<div class="meta">trace ${esc(resp.trace_id)} (no project link available)</div>`;
  return '<div class="meta">tracing disabled, or no question trace for this outcome</div>';
}

thread.addEventListener('click', ev => {
  const b = ev.target.closest('.tabs button'); if (!b) return;
  const id = b.parentElement.dataset.for;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll(`[id^="${id}-"]`).forEach(t => t.classList.toggle('active', t.id === `${id}-${b.dataset.tab}`));
});

// ---- composer ----------------------------------------------------------------
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ask(); } });
sendBtn.addEventListener('click', ask);

greet(); loadHealth(); input.focus();
</script>
</body>
</html>
