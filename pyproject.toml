[project]
name = "ff-analytics-agent"
version = "0.1.0"
description = "Marketing-analytics agent: natural-language questions answered through a Cube semantic layer over ClickHouse (LangChain, LangGraph, Langfuse, OpenRouter free router)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain==1.4.0",  # required by langfuse.langchain (it imports the meta-package)
    "langchain-core==1.6.3",
    "langchain-openrouter==0.2.8",
    "langfuse==4.15.2",
    "langgraph==1.2.11",
    "pydantic>=2.7,<3",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
seed = [
    "clickhouse-connect>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
